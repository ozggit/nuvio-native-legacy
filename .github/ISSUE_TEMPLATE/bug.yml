name: PC Audio problem
description: Report a problem with this unofficial LG / Windows alpha
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report PC Audio problems here. Do not upload pairing keys, account tokens,
        signed stream URLs or the companion data folder. Sending a log to the
        upstream project's service is not required. See the installation guide first.
  - type: input
    id: versions
    attributes:
      label: TV app and companion versions
      placeholder: "TV 2.0.85 / companion 0.2.1"
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: TV model/webOS and Windows version
    validations:
      required: true
  - type: dropdown
    id: pairing
    attributes:
      label: Pairing and fallback status
      options:
        - Paired; PC fallback enabled
        - Paired; fallback disabled
        - Pairing did not complete
        - Not sure
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happens, and how can we reproduce it?
      description: Include TV banner/error text and companion status. Does the TV show a picture? Does the same source work elsewhere?
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio/video codecs and soundbar/AVR input format, if known
      placeholder: "TrueHD 7.1 / HEVC → Sonos DD 5.1"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitised error text (optional)
      description: Remove private URLs, tokens, account details and pairing secrets before posting.
