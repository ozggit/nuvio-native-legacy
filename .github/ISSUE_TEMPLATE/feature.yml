name: Feature request
description: Suggest an improvement to the PC Audio edition
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea and why it helps. Screenshots from other apps are welcome.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - LG webOS
        - Windows companion
        - Pairing / setup
        - Documentation
